name: Build main

on:
  # Runs on pushes to the default branch and on every pull request, including stacked ones
  push:
    branches:
      - main
  pull_request:

jobs:
  # Builds the project for all supported configurations and operating systems
  build:
    strategy:
      matrix:
        # Builds for Debug and Release configurations
        configuration: [Debug, Release]
        # Builds for Ubuntu, Windows, and macOS
        os: [ubuntu-latest, windows-latest, macOS-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.x
            10.x
      # Build on mac/linux
      - name: Build via Bash
        if: runner.os != 'Windows'
        run: |
          chmod +x ./build.sh
          ./build.sh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      # Build on windows
      - name: Build via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.os }}-${{ matrix.configuration }})
          path: '**/TestResults/testResults*.trx'
          reporter: dotnet-trx
